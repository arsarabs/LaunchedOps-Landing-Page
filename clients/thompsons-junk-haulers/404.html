        .error-links { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .btn-primary {

        @media (min-width: 768px) {
            .error-code { font-size: 180px; }
            .error-title { font-size: 40px; }

        }

        /* Footer */

        }
        .footer-bottom {

        .footer-bottom-links a { color: var(--gray-500); font-size: 13px; transition: color 0.2s; }
