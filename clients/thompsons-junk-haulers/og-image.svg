<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1419"/>
      <stop offset="100%" stop-color="#1A1F26"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8AA2A"/>
      <stop offset="100%" stop-color="#F0BC4A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Gold accent bar top -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#gold-grad)"/>

  <!-- Gold accent bar bottom -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#gold-grad)"/>

  <!-- Truck icon (simplified) -->
  <g transform="translate(80, 160)" fill="#E8AA2A" opacity="0.15">
    <path d="M0 120 L0 40 C0 18 18 0 40 0 L260 0 L340 140 L400 140 C418 140 432 154 432 172 L432 240 C432 258 418 272 400 272 L380 272 C380 308 350 338 314 338 C278 338 248 308 248 272 L152 272 C152 308 122 338 86 338 C50 338 20 308 20 272 L0 272 L0 120 Z M86 248 C72 248 62 258 62 272 C62 286 72 296 86 296 C100 296 110 286 110 272 C110 258 100 248 86 248 Z M314 248 C300 248 290 258 290 272 C290 286 300 296 314 296 C328 296 338 286 338 272 C338 258 328 248 314 248 Z" transform="scale(0.8)"/>
  </g>

  <!-- Company Name -->
  <text x="80" y="240" font-family="sans-serif" font-weight="800" font-size="64" fill="#FFFFFF">Thompson's</text>
  <text x="80" y="310" font-family="sans-serif" font-weight="800" font-size="64" fill="#E8AA2A">Junk Haulers</text>

  <!-- Tagline -->
  <text x="80" y="370" font-family="sans-serif" font-weight="400" font-size="28" fill="#B0B8C1">Junk Removal &amp; Full Property Cleanouts</text>

  <!-- Phone -->
  <rect x="80" y="410" width="280" height="56" rx="12" fill="#E8AA2A"/>
  <text x="220" y="446" font-family="sans-serif" font-weight="700" font-size="24" fill="#0F1419" text-anchor="middle">(480) 555-1234</text>

  <!-- Location badge -->
  <text x="400" y="446" font-family="sans-serif" font-weight="500" font-size="22" fill="#B0B8C1">Mesa, AZ &amp; East Valley</text>

  <!-- Stats row -->
  <g transform="translate(80, 510)">
    <text font-family="sans-serif" font-weight="700" font-size="36" fill="#E8AA2A">500+</text>
    <text x="0" y="30" font-family="sans-serif" font-weight="400" font-size="16" fill="#8A929A">Jobs Done</text>

    <text x="200" font-family="sans-serif" font-weight="700" font-size="36" fill="#E8AA2A">4.8</text>
    <text x="260" y="0" font-family="sans-serif" font-weight="700" font-size="36" fill="#E8AA2A">&#9733;</text>
    <text x="200" y="30" font-family="sans-serif" font-weight="400" font-size="16" fill="#8A929A">Google Rating</text>

    <text x="400" font-family="sans-serif" font-weight="700" font-size="36" fill="#34C759">Same Day</text>
    <text x="400" y="30" font-family="sans-serif" font-weight="400" font-size="16" fill="#8A929A">Service Available</text>
  </g>

  <!-- Right side decorative elements -->
  <g transform="translate(850, 100)" opacity="0.08">
    <rect width="300" height="430" rx="20" fill="#E8AA2A"/>
  </g>

  <!-- 5 stars -->
  <g transform="translate(880, 200)" fill="#E8AA2A">
    <text font-family="sans-serif" font-size="40">&#9733; &#9733; &#9733; &#9733; &#9733;</text>
  </g>

  <!-- "Licensed & Insured" badge -->
  <g transform="translate(880, 280)">
    <rect width="240" height="44" rx="22" fill="rgba(232,170,42,0.15)" stroke="#E8AA2A" stroke-width="1.5"/>
    <text x="120" y="28" font-family="sans-serif" font-weight="600" font-size="16" fill="#E8AA2A" text-anchor="middle">Licensed &amp; Insured</text>
  </g>

  <!-- "Same-Day Service" badge -->
  <g transform="translate(880, 340)">
    <rect width="240" height="44" rx="22" fill="rgba(52,199,89,0.15)" stroke="#34C759" stroke-width="1.5"/>
    <text x="120" y="28" font-family="sans-serif" font-weight="600" font-size="16" fill="#34C759" text-anchor="middle">Same-Day Service</text>
  </g>

  <!-- "Free Quotes" badge -->
  <g transform="translate(880, 400)">
    <rect width="240" height="44" rx="22" fill="rgba(232,170,42,0.15)" stroke="#E8AA2A" stroke-width="1.5"/>
    <text x="120" y="28" font-family="sans-serif" font-weight="600" font-size="16" fill="#E8AA2A" text-anchor="middle">Free Quotes</text>
  </g>
</svg>
